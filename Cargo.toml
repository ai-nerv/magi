[workspace]
members = [
  "crates/magi-proto",
  "crates/magi-host",
  "crates/magi-ipc",
  "crates/magi-journal",
  "crates/magi-lua",
  "crates/magi-model",
  "crates/magi-tui",
  "crates/magi-cli",
  "crates/magi-core",
  "crates/magi-testkit",
  "crates/magi-tools",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "deny"
# A dependency nothing uses is a lie about the graph — an edge that exists in `Cargo.toml`, in
# the lockfile and in every diagram somebody draws from them, and nowhere in the code. Nine of
# them were declared across this family.
#
# Enforced by `cargo machete` in `verify`, not by `unused_crate_dependencies`. That lint finds
# the same thing and then finds a great deal more: it runs per *target*, so every integration
# test is reported for every dev-dependency that one file happens not to name — twenty-odd
# warnings here, none of them a lie, and `clippy -Dwarnings` fails on all of them. machete reads
# the manifest against the whole package and has no such blind spot.
unused = { level = "deny", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[workspace.dependencies]
magi-host = { path = "crates/magi-host" }
magi-core = { path = "crates/magi-core" }
magi-ipc = { path = "crates/magi-ipc" }
magi-journal = { path = "crates/magi-journal" }
magi-lua = { path = "crates/magi-lua" }
magi-model = { path = "crates/magi-model" }
magi-proto = { path = "crates/magi-proto" }
magi-testkit = { path = "crates/magi-testkit" }
magi-tools = { path = "crates/magi-tools" }
magi-tui = { path = "crates/magi-tui" }

anyhow = "1.0"
base64 = "0.22"
ciborium = "0.2"
clap = { version = "4.5", features = ["derive", "std", "help", "usage", "error-context"], default-features = false }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
ignore = "0.4"
similar = "2"
luna = { git = "https://github.com/onix-os/luna", tag = "v0.5.0" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "gzip"] }
crossterm = { version = "0.28", default-features = false, features = ["bracketed-paste", "events", "event-stream"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
rustix = { version = "0.38", features = ["fs", "process", "pty", "termios", "stdio"] }
serde = { version = "1.0", features = ["derive"] }
# `preserve_order` so a JSON object keeps the order it arrived in. Without it every map is
# sorted by key, which turns an `edit` header into `new, old, path` — the identifying argument
# last — and quietly reorders tool arguments on their way back to a provider.
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2.0"
tokio-stream = "0.1"
unicode-width = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "time", "sync", "signal", "process"] }

# Pinned rather than left to defaults, the way Tau pins its release profile.
#
# **Fat LTO, one codegen unit.** This is the size setting: it was `thin` and sixteen, and the
# comment here used to warn that changing it "turns a 10-second link into minutes". That was
# measured and it is true -- a rebuild goes from 7s to 44s -- and it is worth it, because the
# same change takes 1.9MB off a 9.8MB binary. `make debug` is what an inner loop should use;
# this profile is what people install.
[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"

# Optimised for size, not speed, because none of these is ever in a hot loop.
#
# Argument parsing runs once, before the UI exists. The recorded-session harness runs only under
# `magi fake-host`, which is the demo. The rest are type definitions with a little code attached.
# Anything that runs per-frame, per-token or per-tool call is deliberately not on this list.
[profile.release.package.clap_builder]
opt-level = "z"
[profile.release.package.clap]
opt-level = "z"
[profile.release.package.clap_lex]
opt-level = "z"
[profile.release.package.magi-testkit]
opt-level = "z"
[profile.release.package.magi-proto]
opt-level = "z"
[profile.release.package.magi-model]
opt-level = "z"
