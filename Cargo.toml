[workspace]
members = [
  "crates/axon-proto",
  "crates/axon-provider",
  "crates/axon-host",
  "crates/axon-ipc",
  "crates/axon-journal",
  "crates/axon-lua",
  "crates/axon-model",
  "crates/axon-tui",
  "crates/axon-cli",
  "crates/axon-core",
  "crates/axon-testkit",
  "crates/axon-tools",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "deny"
unused = { level = "deny", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[workspace.dependencies]
axon-host = { path = "crates/axon-host" }
axon-core = { path = "crates/axon-core" }
axon-ipc = { path = "crates/axon-ipc" }
axon-journal = { path = "crates/axon-journal" }
axon-lua = { path = "crates/axon-lua" }
axon-model = { path = "crates/axon-model" }
axon-proto = { path = "crates/axon-proto" }
axon-provider = { path = "crates/axon-provider" }
axon-testkit = { path = "crates/axon-testkit" }
axon-tools = { path = "crates/axon-tools" }
axon-tui = { path = "crates/axon-tui" }

anyhow = "1.0"
base64 = "0.22"
ciborium = "0.2"
clap = { version = "4.5", features = ["derive", "std", "help", "usage", "error-context"], default-features = false }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
ignore = "0.4"
similar = "2"
luna = { git = "https://github.com/onix-os/luna", tag = "v0.5.0" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "gzip"] }
crossterm = { version = "0.28", default-features = false, features = ["bracketed-paste", "events", "event-stream"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
rustix = { version = "0.38", features = ["fs", "process", "pty", "termios", "stdio"] }
serde = { version = "1.0", features = ["derive"] }
# `preserve_order` so a JSON object keeps the order it arrived in. Without it every map is
# sorted by key, which turns an `edit` header into `new, old, path` — the identifying argument
# last — and quietly reorders tool arguments on their way back to a provider.
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2.0"
tokio-stream = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "time", "sync", "signal"] }

# Pinned rather than left to defaults, the way Tau pins its release profile.
#
# **Fat LTO, one codegen unit.** This is the size setting: it was `thin` and sixteen, and the
# comment here used to warn that changing it "turns a 10-second link into minutes". That was
# measured and it is true -- a rebuild goes from 7s to 44s -- and it is worth it, because the
# same change takes 1.9MB off a 9.8MB binary. `make debug` is what an inner loop should use;
# this profile is what people install.
[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"

# Optimised for size, not speed, because none of these is ever in a hot loop.
#
# Argument parsing runs once, before the UI exists. The recorded-session harness runs only under
# `axon fake-host`, which is the demo. The rest are type definitions with a little code attached.
# Anything that runs per-frame, per-token or per-tool call is deliberately not on this list.
[profile.release.package.clap_builder]
opt-level = "z"
[profile.release.package.clap]
opt-level = "z"
[profile.release.package.clap_lex]
opt-level = "z"
[profile.release.package.axon-testkit]
opt-level = "z"
[profile.release.package.axon-proto]
opt-level = "z"
[profile.release.package.axon-model]
opt-level = "z"
