[package]
name = "axon-agent"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

# **Nothing from axon.** Not a convenience and not a style: this crate is on its way out of the
# workspace, and the day it leaves should be a `git mv` and a `Cargo.toml`, not a rewrite. A
# dependency on `axon-proto` or `axon-tools` would be a rewrite, discovered late.
#
# It costs two small things, both already paid: a `bind` of its own (create the directory, clear
# a socket nothing answers, listen) and a `PeerCred` of its own (`peer_cred` and `getuid`).
# Twenty lines each, against a coupling that would have to be undone.
[dependencies]
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[lints]
workspace = true
