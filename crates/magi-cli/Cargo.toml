[package]
name = "magi-cli"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[[bin]]
name = "magi"
path = "src/main.rs"

[dependencies]
rustix.workspace = true
base64.workspace = true
magi-model.workspace = true
anyhow.workspace = true
magi-ipc.workspace = true
magi-proto.workspace = true
magi-host.workspace = true
magi-lua.workspace = true
magi-tools.workspace = true
magi-testkit.workspace = true
magi-tui.workspace = true
clap.workspace = true
crossterm.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true

[dev-dependencies]
magi-journal.workspace = true
serde_json.workspace = true
# `start_paused` is behind it. Only magi-host asked for it, and feature unification lent it here
# for as long as the two were built together -- so this crate checked green in the workspace and
# red on its own.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
